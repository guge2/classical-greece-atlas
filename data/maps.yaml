# 四幅地图的标题、范围、投影与注记配置。
# extent: [经度最小, 经度最大, 纬度最小, 纬度最大]（WGS84 十进制度）
# 实际成图范围会在投影平面上按地图框宽高比居中扩展，保证等角不变形。

defaults:
  source_note: "底图：Natural Earth 1:10m（公共领域）｜古代地点：Pleiades（CC BY 3.0）｜中文名经人工审定"
