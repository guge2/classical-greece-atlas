[project]
name = "classical-greece-atlas"
version = "1.0.0"
description = "古典希腊中文静态地图集：可重复生成的 A3 静态制图工程"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "Pillow>=10.3",
    "fonttools>=4.53",
    "PyYAML>=6.0",
    "scour>=0.38",
]

[tool.uv]
package = false
